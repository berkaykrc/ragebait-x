<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ragebait settings</title>
    <link rel="stylesheet" href="brand.css">
  </head>
  <body>
    <div class="rb-shell">
      <img src="icon-48.png" alt="" width="48" height="48">
      <span class="rb-head">Ragebait Detector settings</span>
    </div>

    <fieldset id="mode-fieldset" class="rb-card">
      <legend class="rb-label rb-mono">Mode</legend>
      <label for="mode-heuristic"><input
          type="radio"
          name="mode"
          value="heuristic"
          id="mode-heuristic"
          checked
        > Heuristic (v1)</label>
      <label for="mode-proxy"><input
          type="radio"
          name="mode"
          value="proxy"
          id="mode-proxy"
        > Proxy (Phase 2)</label>
      <label for="mode-byok"><input
          type="radio"
          name="mode"
          value="byok"
          id="mode-byok"
        > Bring your own key (Phase 2)</label>
    </fieldset>

    <div id="mode-extra" hidden class="visible"></div>

    <div id="consent-ai" hidden class="rb-card">
      <label for="consentAccepted"><input
          type="checkbox"
          name="consentAccepted"
          id="consentAccepted"
        > I accept the data handling above</label>
    </div>

    <div id="proxy-fields" style="display: none" class="rb-card">
      <label for="proxyUrl">Proxy URL</label>
      <input type="url" name="proxyUrl" id="proxyUrl">
    </div>

    <div id="byok-fields" style="display: none" class="rb-card">
      <label for="byokEndpoint">BYOK endpoint</label>
      <input type="url" name="byokEndpoint" id="byokEndpoint">
      <label for="apiKey">API key</label>
      <input type="password" name="apiKey" id="apiKey">
    </div>

    <label for="misclassification-email" class="rb-card">
      <span class="rb-label rb-mono">Misclassification report email</span>
      <input type="email" id="misclassification-email">
    </label>

    <p class="rb-stat">
      Profiles analysed today:
      <span id="quota-used" class="rb-stat-value rb-mono">0</span>
      /
      <span id="quota-limit" class="rb-mono">200</span>
    </p>

    <div class="rb-legend">
      <span class="rb-legend-item rb-legend-low"></span>
      <span class="rb-legend-item rb-legend-medium"></span>
      <span class="rb-legend-item rb-legend-high"></span>
      <strong>Low</strong> — minimal ragebait engagement<br>
      <strong>Medium</strong> — moderate ragebait engagement<br>
      <strong>High</strong> — strong ragebait engagement
    </div>

    <p>
      <a id="misclassification-mailto" href="#">Report a misclassification</a>
    </p>

    <span id="status" class="rb-status"></span>

    <button id="save-btn" class="rb-btn">Save</button>

    <script src="options.js"></script>
  </body>
</html>
</content>
