# Release: sign with AMO and attach the release assets.
#
# Each Release carries three assets: the signed Firefox XPI, updates.json for
# Firefox's update check, and a Chrome MV3 zip for unpacked/manual install.
# There is no Chrome Web Store publish step.
#
# TWO WAYS TO RELEASE -- both are standard, both are supported:
#
#   1. Push a tag (reproducible, tied to an exact commit):
#        npm run release patch        # bumps, commits, tags, pushes
#        npm run release 0.3.0        # explicit version
#      The tag push is what lands here. The tag IS the release identity.
#
#   2. Run workflow (on demand, no local commands):
#        Actions tab -> release -> Run workflow -> type the version
#      CI bumps both extension manifests, commits, tags, pushes, signs, and
#      creates the Release. Nothing to type in a terminal.
#
# Both paths converge on the same job below. Only the version-preparation step
# differs; everything after it is identical.
#
# WHY CI CANNOT SELF-START: a workflow needs an external signal that a release
# should happen. That signal is either a tag push or a button click. Everything
# after the signal -- build, test, signing, attaching -- is done here.
#
# The AMO credentials live in GitHub Actions secrets (AMO_KEY, AMO_SECRET), not
# in the repo and not on any machine. They are encrypted, masked in logs, and
# unreadable from a clone.
#
# Scoped deliberately narrow:
#   - Never runs on pull_request, so a fork PR can never reach a job holding
#     signing credentials.
#   - `contents: write` only because this job pushes a tag and attaches an
#     asset to a Release. The workflow default is contents: read.
#
# See scripts/sign.sh for the credential-handling rules; it refuses to run
# outside GitHub Actions, so signing exists only in this workflow.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, x.y.z (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_KEY: ${{ secrets.AMO_KEY }}
      AMO_SECRET: ${{ secrets.AMO_SECRET }}

    steps:
      # GitHub removed Node20 from the runners on 23 September 2026. An action
      # that still declares `runs.using: node20` cannot run there, so checkout
      # and setup-node stay on v7, which run on Node24.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full tag history, so duplicate tags are detectable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only on the button path: there is no tag yet, so establish one. This
      # push uses the default GITHUB_TOKEN, and events created by GITHUB_TOKEN
      # do not start new workflow runs -- so this cannot re-trigger this
      # workflow. Using a PAT here would, and would loop.
      - name: Bump, commit, tag and push (button path only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' is not x.y.z (e.g. 0.1.1)"
            exit 1
          fi

          tag="v${VERSION}"

          # Later steps (tag assert, gh release create) must resolve the tag
          # the same way on both paths: the button path exports RELEASE_TAG,
          # the tag path falls back to GITHUB_REF_NAME. GITHUB_REF_NAME on
          # this path is the branch, not the tag.
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

          # AMO rejects re-uploading a version it already holds, so a reused
          # number is unrecoverable. Catch it before signing rather than after.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists on the remote"
            echo "AMO will refuse this version. Choose a higher one."
            exit 1
          fi

          for manifest in manifest.mv2.json manifest.mv3.json; do
            MANIFEST="$manifest" node -e '
              const fs = require("fs");
              const p = process.env.MANIFEST;
              const src = fs.readFileSync(p, "utf8");
              fs.writeFileSync(
                p,
                src.replace(/("version"\s*:\s*)"[^"]*"/, (_m, pre) => `${pre}"${process.env.VERSION}"`),
              );
            '
          done

          npm pkg set version="${VERSION}"
          npm install --package-lock-only --no-audit --no-fund

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The manifest may already be at the requested version -- someone can
          # bump it by hand and then use this button. `git commit` exits 1 with
          # "nothing to commit" in that case, which under `set -e` would fail
          # the whole run. Commit only when there is genuinely something to
          # commit, and tag either way.
          if git diff --quiet -- manifest.mv2.json manifest.mv3.json package.json package-lock.json; then
            echo "files are already at ${VERSION}; tagging without a commit"
          else
            git add manifest.mv2.json manifest.mv3.json package.json package-lock.json
            git commit -m "release: ${tag}"
          fi

          git tag "${tag}"
          git push origin HEAD
          git push origin "${tag}"
          echo "pushed ${tag}"

      # Catches the one mistake worth catching on the tag path: tagging a new
      # version while forgetting to bump "version" in the manifests. AMO and
      # the Chrome Web Store match versions by that field, so the tag would
      # be a lie.
      #
      # It deliberately does NOT try to detect an already-signed version on the
      # tag path -- git tags and AMO versions are separate histories, and local
      # tags say nothing about what AMO holds. AMO's own error is the clearest
      # report of that. The button path catches it above, where it can.
      #
      # RELEASE_TAG holds the tag the button path pushed; the tag path leaves
      # it unset and falls back to GITHUB_REF_NAME.
      - name: Assert the tag matches both manifest versions
        run: |
          set -euo pipefail
          tag_name="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          expected="${tag_name#v}"
          for manifest in manifest.mv2.json manifest.mv3.json; do
            current="$(MANIFEST="$manifest" node -p 'JSON.parse(require("fs").readFileSync(process.env.MANIFEST,"utf8")).version')"
            if [ "$current" != "$expected" ]; then
              echo "::error::tag ${tag_name} does not match ${manifest} version ${current}"
              echo "Bump \"version\" in ${manifest}, or use the Run workflow button."
              exit 1
            fi
            echo "${manifest} version ${current} matches tag ${tag_name}"
          done

      - name: Build
        run: npm run build

      # web-ext names its zip after the manifest. The packaging script also
      # writes the stable asset name used in the download link.
      - name: Package Chrome MV3
        run: npm run package:mv3

      # Fail before signing: scans dist-mv2/, dist-mv3/ and the packaged
      # Chrome zip for credential-shaped values. The signed Firefox XPI is
      # created later by sign.sh, so packaged-XPI member scanning happens in
      # the release checklist's `npm run package` + `npm run check:artifacts`
      # step. The workflow that signs the XPI must not be able to skip the
      # secret scan.
      - name: Artifact secret scan
        run: npm run check:artifacts

      # Do not sign a build whose tests fail.
      - name: Test
        run: npm test

      # update_url points at the latest GitHub Release. A private repository
      # serves those assets only to authenticated users, so every permanent
      # install would fail its update check.
      - name: Require a public repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "::error::update_url targets GitHub Releases, so ${GITHUB_REPOSITORY} must be public before a release."
            exit 1
          fi

      - name: Sign with AMO
        run: ./scripts/sign.sh

      # Firefox fetches update_url -> updates.json and compares its version.
      # The signed .xpi gets a stable asset name so the latest-release link
      # never changes between versions.
      - name: Prepare the update artifacts
        run: |
          set -euo pipefail
          artifact="$(ls web-ext-artifacts/*.xpi)"
          cp "$artifact" "web-ext-artifacts/ragebait-detector.xpi"
          node scripts/update-manifest.mjs --out web-ext-artifacts/updates.json

      - name: Attach the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_name="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          gh release create "${tag_name}" \
            --title "${tag_name}" \
            --generate-notes \
            web-ext-artifacts/ragebait-detector.xpi \
            web-ext-artifacts/updates.json \
            web-ext-artifacts/ragebait-detector-mv3.zip
