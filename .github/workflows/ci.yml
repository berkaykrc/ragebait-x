name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Read from .deno-version, never hardcoded here. An unpinned "2.x"
          # installs whatever the newest 2.x happens to be, and `deno fmt`'s
          # output is not stable across releases -- 2.9.x reformats embedded
          # <style> CSS differently from 2.6.x. That made fmt:check fail in CI
          # on a commit that was green locally. Bump .deno-version and reformat
          # in the same commit.
          deno-version-file: .deno-version

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Check formatting
        run: npm run fmt:check

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
