name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # GitHub removed Node20 from the runners on 23 September 2026. An action
      # that still declares `runs.using: node20` cannot run there, so checkout
      # and setup-node stay on v7, which run on Node24. setup-deno@v2 already
      # runs on Node24.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Read from .deno-version, never hardcoded here. An unpinned "2.x"
          # installs whatever the newest 2.x happens to be, and `deno fmt`'s
          # output is not stable across releases -- 2.9.x reformats embedded
          # <style> CSS differently from 2.6.x. That made fmt:check fail in CI
          # on a commit that was green locally. Bump .deno-version and reformat
          # in the same commit.
          deno-version-file: .deno-version

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Check formatting
        run: npm run fmt:check

      - name: Build
        run: npm run build

      # Exercises the release-only packaging path on every push. Without this,
      # its first run would be the release job, after the tag already exists.
      - name: Package Chrome MV3
        run: npm run package:mv3

      # Fail the build before anything else runs if credential-shaped values
      # reached dist-mv2/, dist-mv3/ or the packaged Chrome zip.
      - name: Artifact secret scan
        run: npm run check:artifacts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
